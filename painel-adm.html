<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - TechStore</title>
  <link rel="stylesheet" href="src/admin/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script>
    try {
      if ((JSON.parse(localStorage.getItem("usuarioLogado")) || {}).tipo !== "admin") throw 0;
    } catch (e) {
      sessionStorage.setItem("techstore_flash", JSON.stringify({ msg: "Acesso restrito a administradores.", tipo: "erro" }));
      location.replace("entrar.html");
    }
  </script>
</head>
<body>
  <aside class="side">
    <a href="index.html" class="brand"><img src="src/res/logoTechStore.png" alt="TechStore"></a>
    <nav class="nav">
      <a href="#/dash" data-v="dash"><i class="fa-solid fa-chart-pie"></i>Dashboard</a>
      <a href="#/pedidos" data-v="pedidos"><i class="fa-solid fa-bag-shopping"></i>Pedidos</a>
      <a href="#/produtos" data-v="produtos"><i class="fa-solid fa-box"></i>Produtos</a>
      <a href="#/relatorios" data-v="relatorios"><i class="fa-solid fa-chart-column"></i>Relatórios</a>
      <a href="#/config" data-v="config"><i class="fa-solid fa-gear"></i>Configurações</a>
      <a href="index.html" class="sp"><i class="fa-solid fa-store"></i>Ver loja</a>
      <a data-a="sair"><i class="fa-solid fa-right-from-bracket"></i>Sair</a>
    </nav>
  </aside>
  <div class="main">
    <header class="top">
      <button class="ib" data-a="menu" aria-label="Abrir menu"><i class="fa-solid fa-bars"></i></button>
      <h1 id="titulo"></h1>
      <span id="ola"></span>
    </header>
    <main id="view"></main>
  </div>
  <dialog id="dlg"></dialog>
  <script src="src/js/dados.js"></script>
  <script src="src/admin/admin.js"></script>
</body>
</html>
